name: update-sector-flow

on:
  schedule:
    # 以下为UTC。北京时间 = UTC+8
    - cron: "*/15 1-6 * * 1-5"   # 09:00-14:59 每15分钟：盘中暂计
    - cron: "30 7 * * 1-5"       # 15:30：盘后定稿（写入历史）
    - cron: "30 11 * * 1-5"      # 19:30：ETF份额快照与验证
  workflow_dispatch:
    inputs:
      mode:
        description: "intraday / final / etf / backfill（backfill 只需手动跑一次，约1~2小时）"
        default: "final"

concurrency:
  group: sector-flow
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340   # backfill 需要较长时间；日常模式几分钟内结束
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 选择模式
        id: m
        run: |
          if [ -n "${{ github.event.inputs.mode }}" ]; then echo "mode=${{ github.event.inputs.mode }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "30 7 * * 1-5" ]; then echo "mode=final" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "30 11 * * 1-5" ]; then echo "mode=etf" >> $GITHUB_OUTPUT
          else echo "mode=intraday" >> $GITHUB_OUTPUT; fi
      - name: 运行
        run: python run.py ${{ steps.m.outputs.mode }}
      - name: 提交结果
        run: |
          git config user.name "sector-flow-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || (git commit -m "update ${{ steps.m.outputs.mode }} $(date -u +%F\ %H:%M)" && git pull --rebase && git push)
